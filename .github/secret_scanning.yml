# GitHub secret scanning 設定
#
# 為什麼要排除這些路徑：
# `public/apks/youtube-direct-downloader.user.js` 是 esbuild 打包後的產物（1.1 MB），
# 內含第三方套件 youtubei.js 硬編碼的 YouTube Innertube API key
# （`youtubei.js/dist/src/utils/Constants.js` 的 CLIENT.WEB.API_KEY）。
# 該 key 是 YouTube 前端公開使用的共用金鑰，不屬於本專案、也無法輪替或撤銷，
# 每次 build 都會重新產生，因此排除掃描以免每次建置都誤報。
#
# 注意：paths-ignore 只影響「之後」的告警；既有的告警仍須手動關閉。
# 排除範圍刻意收窄到產生檔，不整個排除 public/apks/ 或 *.user.js，
# 以免未來手寫腳本真的夾帶憑證時被漏掃。
paths-ignore:
  - "dist/**"
  - "public/apks/youtube-direct-downloader.user.js"
